<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" fill="none">
  <rect width="800" height="800" fill="#ffffff" rx="0" />
  <g transform="translate(95, 255)">
    <!-- Hand Icon (Left) -->
    <g transform="translate(0, 0)">
      <!-- Outer Palm U-Shape (Left finger down around to right thumb) -->
      <path 
        d="M 20 62 L 20 160 C 20 226 68 250 115 250 C 162 250 210 226 210 160 L 210 126" 
        stroke="#FAB518" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
      />
      <!-- Inner Finger 1 -->
      <line x1="67" y1="28" x2="67" y2="160" stroke="#FAB518" stroke-width="22" stroke-linecap="round" />
      <!-- Inner Finger 2 (Tallest) -->
      <line x1="115" y1="0" x2="115" y2="154" stroke="#FAB518" stroke-width="22" stroke-linecap="round" />
      <!-- Inner Finger 3 -->
      <line x1="163" y1="40" x2="163" y2="160" stroke="#FAB518" stroke-width="22" stroke-linecap="round" />
    </g>

    <!-- Wordmark (Right) -->
    <!-- 'Hel' -->
    <text x="285" y="182" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="170" font-weight="900" fill="#142142" letter-spacing="-4">Hel</text>
    
    <!-- Custom 'p' with extended descender reaching baseline of 'ideias digitais' -->
    <g transform="translate(605, 45)">
      <!-- Bowl of 'p' -->
      <circle cx="66" cy="88" r="50" fill="#142142" />
      <circle cx="66" cy="88" r="26" fill="#ffffff" />
      <!-- Stem of 'p' descending down past ideias digitais -->
      <rect x="0" y="20" width="30" height="200" rx="0" fill="#142142" />
    </g>

    <!-- 'ideias digitais' placed neatly under 'Hel' -->
    <text x="288" y="226" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="41" font-weight="700" fill="#142142" letter-spacing="-0.5">ideias digitais</text>
  </g>
</svg>